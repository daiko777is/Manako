name: CI

# ⚠️ ACTIVACIÓN: este archivo vive en devops/ porque el PAT usado para el push
# inicial no tenía el scope `workflow`. Para activar el pipeline:
#   1. Cópialo a .github/workflows/ci.yml (git mv devops/github-actions-ci.yml
#      .github/workflows/ci.yml && git commit && git push con un token que
#      tenga el scope `workflow`, o súbelo desde la web de GitHub).
#
# Pipeline sugerido por la spec (§12):
# lint+typecheck → tests unitarios → build → escaneo de dependencias →
# deploy staging (develop) → deploy producción (main, manual) → smoke tests.

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint -w @manako/api --if-present
      - run: npm run typecheck -w @manako/api

  test-api:
    name: Tests unitarios API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test -w @manako/api -- --coverage

  build:
    name: Build (API + Web)
    runs-on: ubuntu-latest
    needs: [quality, test-api]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build API (NestJS)
        run: npm run build -w @manako/api
      - name: Build Web (Angular production)
        run: npm run build -w @manako/web
        env:
          NG_APP_API_URL: ${{ vars.STAGING_API_URL }}
          NG_APP_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
          NG_APP_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist/web/browser
          retention-days: 7

  security:
    name: Escaneo de dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: npm audit (high+)
        run: npm audit --audit-level=high
        continue-on-error: true # no bloquea el pipeline; revisar en Dependabot/Snyk

  deploy-staging:
    name: Deploy staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    needs: [build, security]
    environment: staging
    steps:
      - uses: actions/checkout@v4
      # 1) Migraciones explícitas contra la BD de staging (spec §12 paso 7)
      - name: Aplicar migraciones SQL (Supabase staging)
        run: |
          echo "→ supabase link --project-ref $SUPABASE_STAGING_REF && supabase db push"
          echo "  (instalar Supabase CLI y configurar SUPABASE_ACCESS_TOKEN en secrets)"
      # 2) Despliegue backend (Railway/Render/Fly) y frontend (Vercel/Netlify/CF Pages)
      - name: Deploy backend + frontend
        run: echo "Conectar con Railway CLI / Vercel CLI según docs/SETUP.md"
      # 3) Smoke tests post-deploy
      - name: Smoke test (health)
        run: |
          curl -fsS "${{ vars.STAGING_API_URL }}/health" || exit 1

  deploy-production:
    name: Deploy producción (aprobación manual)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build, security]
    environment: production # requiere aprobación manual en GitHub
    steps:
      - uses: actions/checkout@v4
      - name: Migraciones + deploy
        run: echo "Mismo flujo que staging, con credenciales de producción"
      - name: Smoke tests críticos
        run: |
          curl -fsS "${{ vars.PROD_API_URL }}/health" || exit 1
          echo "→ Añadir aquí checks de login y checkout (spec §12 paso 8)"
